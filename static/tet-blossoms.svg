<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 210" fill="none">
  <defs>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f0a81e"/>
      <stop offset=".5" stop-color="#fbcf33"/>
      <stop offset="1" stop-color="#fff0a6"/>
    </linearGradient>
    <radialGradient id="bud" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="1" stop-color="#f0a81e"/>
    </radialGradient>
    <!-- Mai vang flower: 5 petals, green sepals, ring of long stamens -->
    <g id="flower">
      <g fill="#6f9a4a">
        <path d="M0 0-2.6-6.5 0-8.4 2.6-6.5Z" transform="rotate(36)"/>
        <path d="M0 0-2.6-6.5 0-8.4 2.6-6.5Z" transform="rotate(108)"/>
        <path d="M0 0-2.6-6.5 0-8.4 2.6-6.5Z" transform="rotate(180)"/>
        <path d="M0 0-2.6-6.5 0-8.4 2.6-6.5Z" transform="rotate(252)"/>
        <path d="M0 0-2.6-6.5 0-8.4 2.6-6.5Z" transform="rotate(324)"/>
      </g>
      <g fill="url(#petal)" stroke="#d39a1c" stroke-width=".5">
        <path id="p" d="M0-1.5C-5.4-4.5-7.6-11.6-4.4-15.2C-2.2-17.4 2.2-17.4 4.4-15.2C7.6-11.6 5.4-4.5 0-1.5Z"/>
        <use href="#p" transform="rotate(72)"/>
        <use href="#p" transform="rotate(144)"/>
        <use href="#p" transform="rotate(216)"/>
        <use href="#p" transform="rotate(288)"/>
      </g>
      <circle r="7.2" stroke="#e8a52a" stroke-width=".5"/>
      <circle r="7.6" stroke="#b4501f" stroke-width="1.6" stroke-dasharray="1.1 1.9"/>
      <circle r="2.1" fill="#7ea24a"/>
    </g>
    <!-- Young bronze leaf (loc) and mature green leaf -->
    <g id="loc"><path d="M0 0C4.5-5 4.5-14 0-19C-4.5-14-4.5-5 0 0Z" fill="#b8613f"/><path d="M0-1V-17" stroke="#8a3f27" stroke-width=".6"/></g>
    <g id="leaf"><path d="M0 0C4.5-5 4.5-14 0-19C-4.5-14-4.5-5 0 0Z" fill="#8fb06a"/><path d="M0-1V-17" stroke="#648446" stroke-width=".6"/></g>
  </defs>

  <ellipse cx="90" cy="203" rx="46" ry="5" fill="#a89067" opacity=".14"/>

  <!-- Branches -->
  <g stroke="#8a6e5b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M90 160C88 138 76 112 62 84" stroke-width="5"/>
    <path d="M62 84C58 68 60 54 66 42" stroke-width="2.4"/>
    <path d="M70 100C58 90 46 80 36 70" stroke-width="2.2"/>
    <path d="M84 132C102 116 118 96 130 66" stroke-width="3"/>
    <path d="M130 66C132 54 130 44 124 32" stroke-width="1.6"/>
    <path d="M104 111C120 106 138 100 152 90" stroke-width="2"/>
    <path d="M97 84C102 72 106 62 112 52" stroke-width="1.5"/>
  </g>
  <path d="M92 158C90 138 79 113 65 86" stroke="#c3a993" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>

  <!-- Flower stalks -->
  <g stroke="#8f8150" stroke-width=".9" stroke-linecap="round">
    <path d="M66 42Q64 36 62 30"/>
    <path d="M36 70Q34 64 31 60"/>
    <path d="M130 66Q134 58 136 52"/>
    <path d="M152 90Q156 84 160 80"/>
    <path d="M112 52Q116 44 118 38"/>
    <path d="M124 32Q124 26 122 21"/>
    <path d="M62 84Q52 86 46 92"/>
    <path d="M97 84Q92 78 86 76"/>
  </g>

  <!-- Leaves -->
  <use href="#loc" transform="translate(64 60) rotate(-62) scale(.8)"/>
  <use href="#loc" transform="translate(132 54) rotate(58) scale(.8)"/>
  <use href="#leaf" transform="translate(104 110) rotate(70) scale(.8)"/>
  <use href="#leaf" transform="translate(46 80) rotate(-70) scale(.75)"/>
  <use href="#loc" transform="translate(76 112) rotate(-110) scale(.7)"/>
  <use href="#leaf" transform="translate(122 90) rotate(40) scale(.7)"/>

  <!-- Buds -->
  <g>
    <circle cx="48" cy="52" r="2.8" fill="#9fbf62"/>
    <circle cx="146" cy="70" r="3.2" fill="url(#bud)"/>
    <circle cx="106" cy="40" r="2.7" fill="#9fbf62"/>
    <circle cx="138" cy="102" r="2.7" fill="#9fbf62"/>
    <circle cx="86" cy="94" r="3.2" fill="url(#bud)"/>
  </g>

  <!-- Flowers -->
  <use href="#flower" transform="translate(62 30) rotate(-8) scale(1)"/>
  <use href="#flower" transform="translate(31 60) rotate(14) scale(.9)"/>
  <use href="#flower" transform="translate(137 52) rotate(10) scale(1)"/>
  <use href="#flower" transform="translate(161 80) rotate(-12) scale(.82)"/>
  <use href="#flower" transform="translate(119 38) rotate(22) scale(.78)"/>
  <use href="#flower" transform="translate(122 20) rotate(-6) scale(.62)"/>
  <use href="#flower" transform="translate(46 92) rotate(-20) scale(.82)"/>
  <use href="#flower" transform="translate(85 76) rotate(8) scale(.86)"/>

  <!-- Li xi envelope -->
  <path d="M119 96v18" stroke="#c9464f" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="119" cy="114" r="1.8" fill="#c9464f"/>
  <g transform="translate(108 115)" stroke="#932a33" stroke-width="1" stroke-linejoin="round">
    <rect width="22" height="31" rx="2" fill="#cf3f4a"/>
    <path d="M0 2 11 11 22 2" fill="#b8323d"/>
    <circle cx="11" cy="19" r="4.6" stroke="#f2cf73"/>
    <path d="m11 15.8 3.2 3.2-3.2 3.2-3.2-3.2Z" fill="#f2cf73" stroke="none"/>
  </g>

  <!-- Pot -->
  <g stroke="#a15c56" stroke-width="2" stroke-linejoin="round">
    <path d="M65 168H115L108 200H72Z" fill="#cf8d7e"/>
    <path d="M60 158H120V169H60Z" fill="#e4b09b"/>
  </g>
  <path d="M68 180H112" stroke="#f2cf73" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M75 188q4-3 8 0t8 0 8 0 8 0" stroke="#f2cf73" stroke-width="1" stroke-linecap="round" opacity=".8"/>
  <path d="M64 158q26-6 52 0" stroke="#6b4a36" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g stroke="#b98f4a" stroke-width="1.5" stroke-linecap="round">
    <path d="M14 112v9m-4.5-4.5h9M162 128v9m-4.5-4.5h9"/>
  </g>
</svg>
