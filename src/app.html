<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		%sveltekit.head%
		<script>
			try {
				const storedTheme = localStorage.getItem('portfolio-theme');
				if (storedTheme === 'ganyu' || storedTheme === 'evelyn') {
					document.documentElement.classList.add(`${storedTheme}-theme`);
				}

				const storedDarkMode = localStorage.getItem('portfolio-dark-mode');
				if (
					storedDarkMode === 'true' ||
					(storedDarkMode === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
