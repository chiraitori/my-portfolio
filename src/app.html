<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			try {
				if (localStorage.getItem('portfolio-theme') === 'ganyu') {
					document.documentElement.classList.add('ganyu-theme');
				}
				if (localStorage.getItem('portfolio-dark-mode') === 'true') {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
